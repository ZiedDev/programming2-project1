<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 792 924" width="792" height="924"><defs/><g><g class="title" data-source-line="4"><text x="254.01" y="23" font-size="14" fill="#000000" xml:space="preserve" style="white-space: pre" font-weight="bold" font-family="sans-serif">Mission Lifecycle - State Machine Diagram</text></g><rect x="550.67" y="124" width="59.81" height="40" rx="12.50" ry="12.50" fill="#F1F1F1" stroke="#181818" stroke-width="0.50"/><text x="555.67" y="149" font-size="14" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">Created</text><g class="entity" data-qualified-name="check" id="ent0002"><polygon points="580.57,286.50 592.57,298.50 580.57,310.50 568.57,298.50 580.57,286.50" fill="#F1F1F1" stroke="#181818" stroke-width="0.50"/></g><g class="start_entity" data-qualified-name=".start." id="ent0003" data-source-line="9"><circle cx="580.57" cy="53" r="10" fill="#222222" stroke="#222222" stroke-width="1"/></g><rect x="414.39" y="448" width="82.35" height="40" rx="12.50" ry="12.50" fill="#F1F1F1" stroke="#181818" stroke-width="0.50"/><text x="419.39" y="473" font-size="14" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">ASSIGNED</text><rect x="429.45" y="714" width="58.24" height="40" rx="12.50" ry="12.50" fill="#F1F1F1" stroke="#181818" stroke-width="0.50"/><text x="434.45" y="739" font-size="14" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">FAILED</text><rect x="7" y="581" width="111.14" height="40" rx="12.50" ry="12.50" fill="#F1F1F1" stroke="#181818" stroke-width="0.50"/><text x="12" y="606" font-size="14" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">IN_PROGRESS</text><rect x="103.01" y="714" width="97.12" height="40" rx="12.50" ry="12.50" fill="#F1F1F1" stroke="#181818" stroke-width="0.50"/><text x="108.01" y="739" font-size="14" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">COMPLETED</text><g class="end_entity" data-qualified-name=".end." id="ent0017" data-source-line="32"><circle cx="224.57" cy="865" r="11" fill="#00000000" stroke="#222222" stroke-width="1"/><circle cx="224.57" cy="865" r="6" fill="#222222" stroke="#222222" stroke-width="1"/></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="16"><path d="M251.65,241 L251.65,356 A0,0 0 0 0 251.65,356 L533.48,356 A0,0 0 0 0 533.48,356 L533.48,302.50 L568.18,298.50 L533.48,294.50 L533.48,251 L523.48,241 L251.65,241 A0,0 0 0 0 251.65,241" fill="#FEFFDD" stroke="#181818" stroke-width="0.50"/><path d="M523.48,241 L523.48,251 L533.48,251 L523.48,241" fill="#FEFFDD" stroke="#181818" stroke-width="0.50"/><text x="257.65" y="258" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-weight="bold" font-family="sans-serif">Submission valid if ALL hold:</text><text x="257.65" y="273" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">- No other mission is active</text><text x="257.65" y="288" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">- Environment allows mission</text><text x="257.65" y="303" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">- Mission requirements are valid</text><text x="257.65" y="318" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">- Capable &amp; available agents exist</text><text x="257.65" y="333" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">- Sufficient resources &amp; equipment</text><text x="257.65" y="348" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">*(Otherwise rejected; never becomes active)*</text></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="36"><path d="M282.99,815 L282.99,915 A0,0 0 0 0 282.99,915 L634.14,915 A0,0 0 0 0 634.14,915 L634.14,825 L624.14,815 L462.57,815 L458.57,754.31 L454.57,815 L282.99,815 A0,0 0 0 0 282.99,815" fill="#FEFFDD" stroke="#181818" stroke-width="0.50"/><path d="M624.14,815 L624.14,825 L634.14,825 L624.14,815" fill="#FEFFDD" stroke="#181818" stroke-width="0.50"/><text x="288.99" y="832" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-weight="bold" font-family="sans-serif">Runtime failure causes:</text><text x="288.99" y="847" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">- Environmental restriction (dust storm / comm disruption)</text><text x="288.99" y="862" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">- Equipment failure / breakdown</text><text x="288.99" y="877" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif">- Insufficient battery</text><text x="288.99" y="892" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> </text><text x="288.99" y="907" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-weight="bold" font-family="sans-serif">Terminal:</text><text x="346.54" y="907" font-size="13" fill="#000000" xml:space="preserve" style="white-space: pre" font-family="sans-serif"> cannot be retried; create a new Mission.</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk4" data-source-line="9" data-link-type="dependency"><path d="M580.57,63.19 C580.57,77.4 580.57,100.02 580.57,118.74" fill="none" stroke="#181818" stroke-width="1"/><polygon points="580.57,123.74 584.57,114.74 580.57,118.74 576.57,114.74 580.57,123.74" fill="#181818" stroke="#181818" stroke-width="1"/></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-li